<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found (404) | FloraScan AI</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #090d16;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 500px;
      padding: 2.5rem;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .badge {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    h1 {
      color: #fff;
      font-size: 1.75rem;
      margin: 0.5rem 0;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #10b981;
      color: #022c22;
      font-weight: 800;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #34d399;
    }
    .links {
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }
    .links a {
      color: #34d399;
      text-decoration: none;
      margin: 0 0.5rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">🌿 404</div>
    <h1>Specimen Page Not Found</h1>
    <p>The foliar pathology record or page you requested does not exist or has been relocated.</p>
    <a href="/" class="btn">Return to Diagnostic Studio</a>
    <div class="links">
      <a href="/diseases/">Plant Disease Directory</a> •
      <a href="/#faqSection">Agronomy FAQs</a>
    </div>
  </div>
</body>
</html>
