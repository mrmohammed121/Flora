<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extended Ticket Card - Full Media</title>
  <style>
    /* Page centering */
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
      font-family: "Inter", sans-serif;
      gap: 1.5rem;
    }

    /* From Uiverse.io by dexter-st - Extended Full Media Card */
    .card {
      --width: 180px;
      --height: 320px;
      --perforation-size: 12px;
      --cutouts-adjust: 70px;

      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      width: var(--width);
      height: var(--height);
      padding: var(--perforation-size) 0;

      font-family: "Inter", sans-serif;
      font-size: 1rem;
      user-select: none;
      overflow: hidden;

      filter: drop-shadow(0 2px 1px #00000025) drop-shadow(0 4px 3px #00000025)
        drop-shadow(0 10px 9px #00000025) drop-shadow(0 20px 20px #00000025)
        drop-shadow(0 40px 40px #00000025);
      animation: hover 3s ease infinite;
      will-change: transform, filter;
    }

    @keyframes hover {
      50% {
        filter: drop-shadow(0 4px 3px #00000015) drop-shadow(0 6px 6px #00000015)
          drop-shadow(0 16px 14px #00000015) drop-shadow(0 30px 28px #00000015)
          drop-shadow(0 60px 60px #00000015);
        transform: translateY(-7px) scale(1.02);
      }
    }

    .filter {
      position: absolute;
    }

    .bg {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-color: #fff;
      filter: url(#bump);
      mask:
        /* top perforations */
        radial-gradient(
          circle at 50% 0,
          #fff0 calc(var(--perforation-size) - 5px),
          #000 calc(var(--perforation-size) - 4px)
        ),
        /* bottom perforations */
        radial-gradient(
          circle at 50% 100%,
          #fff0 calc(var(--perforation-size) - 5px),
          #000 calc(var(--perforation-size) - 4px)
        ),
        /* left notch */
        radial-gradient(circle 8px at left center, #000 98%, #0000 100%),
        /* right notch */
        radial-gradient(circle 8px at right center, #000 98%, #0000 100%),
        /* cut perforation */
        repeating-linear-gradient(
          90deg,
          #000 10px,
          #000 15px,
          #0000 16px,
          #0000 24px
        );

      mask-repeat: repeat-x, repeat-x, no-repeat, no-repeat, repeat-x;

      mask-size:
        calc(var(--perforation-size) * 2) 100%,
        calc(var(--perforation-size) * 2) 100%,
        16px 16px,
        16px 16px,
        10px 2px;

      mask-position:
        calc(0.5 * var(--perforation-size)) top,
        calc(0.5 * var(--perforation-size)) bottom,
        left var(--cutouts-adjust),
        right var(--cutouts-adjust),
        0 calc(var(--cutouts-adjust) + 7px);

      mask-composite: intersect, exclude, add, add;
    }

    .holographic {
      background-image: linear-gradient(to bottom, #fe58, 90%, #0002),
        conic-gradient(
          at 60% 50%,
          #ccc,
          #ff6bfe,
          #00f9f8,
          #ddd,
          #0081fd,
          #eef0bc,
          #0081fd,
          #ff6bfe,
          #0002,
          #0081fd,
          #ddd,
          #01fefb,
          #ccc
        );
    }
    .holographic::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 70% 20%, #f0f, #0000),
        repeating-radial-gradient(circle at 30% 80%, #fff, #f4a 48px, #eeeeee 150px);
      mix-blend-mode: color-burn;
    }
    .holographic::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(to bottom, #f205, #f00, #0f0, #f205);
      mix-blend-mode: difference;

      animation: bg-pos 3s ease-in-out infinite alternate;
      background-position: 0 0;
      background-size: 100% 300%;
      background-repeat: repeat;
    }

    @keyframes bg-pos {
      to {
        background-position: 0 500px;
      }
    }

    /* Extended Media Body: fills the entire card area */
    .body {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: calc(var(--perforation-size) + 6px) 10px;
      box-sizing: border-box;
      z-index: 2;
      overflow: hidden;
    }

    /* Extended video / image filling the card */
    .card-video,
    .card-image {
      width: 100%;
      height: 100%;
      max-height: calc(var(--height) - (var(--perforation-size) * 2) - 12px);
      object-fit: cover;
      border-radius: 8px;
      mix-blend-mode: multiply; /* Blends white background into holographic gradient */
      display: block;
    }

    .notes {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-size: 5rem;
      color: #e7e7e7;
      mix-blend-mode: color-burn;
      transform: translateY(20%);
      z-index: 1;
      pointer-events: none;
    }
    .notes:nth-child(2) {
      transform: translateY(40%);
    }
    .notes:nth-child(3) {
      transform: translateY(60%);
    }

    /* Optional toggle bar for testing contain vs cover */
    .fit-toggle {
      display: flex;
      gap: 0.5rem;
      z-index: 10;
    }

    .fit-toggle button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .fit-toggle button.active,
    .fit-toggle button:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <!-- Extended Ticket Card with Header and Footer Removed -->
  <div class="card">
    <div class="notes">♪♪♪♪♪</div>
    <div class="notes">♪♪♪♪</div>
    <div class="notes">♪♪♪♪♪</div>

    <!-- Header ("TICKET") & Footer ("Seat E7" + barcode) Removed -->
    <!-- Extended Media fills the entire height of the card -->
    <div class="body">
      <video id="ticket-media" class="card-video" autoplay loop muted playsinline>
        <source src="aiiii.mp4" type="video/mp4" />
        <source src="ticket-video.mp4" type="video/mp4" />
      </video>
    </div>

    <div class="bg holographic"></div>
    <svg class="filter">
      <filter id="bump">
        <feTurbulence
          result="noise"
          numOctaves="3"
          baseFrequency="0.7"
          type="fractalNoise"
        ></feTurbulence>
        <feSpecularLighting
          in="noise"
          result="specular"
          lighting-color="#fffffc"
          specularExponent="25"
          specularConstant="0.8"
          surfaceScale="0.15"
        >
          <fePointLight z="210" y="100" x="100"></fePointLight>
        </feSpecularLighting>
        <feComposite
          result="noise2"
          operator="in"
          in="specular"
          in2="SourceGraphic"
        ></feComposite>
        <feBlend mode="screen" in2="noise2" in="SourceGraphic"></feBlend>
      </filter>
    </svg>
  </div>

  <div class="fit-toggle">
    <button id="btn-cover" class="active" onclick="setFit('cover')">Fit: Cover (Full Stretch)</button>
    <button id="btn-contain" onclick="setFit('contain')">Fit: Contain (Aspect Ratio)</button>
  </div>

  <script>
    function setFit(fitType) {
      const media = document.getElementById('ticket-media');
      if (media) media.style.objectFit = fitType;
      document.getElementById('btn-cover').classList.toggle('active', fitType === 'cover');
      document.getElementById('btn-contain').classList.toggle('active', fitType === 'contain');
    }
  </script>

</body>
</html>
